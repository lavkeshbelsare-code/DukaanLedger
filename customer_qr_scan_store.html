<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DukaanLedger | Customer QR Storefront</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top left, #0f172a, #090d16 60%, #030712); color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    </style>
</head>
<body class="antialiased p-4 flex items-center justify-center">
    <div class="max-w-md w-full glass-panel rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col min-h-[780px]">
        <header class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white p-5 border-b border-white/10">
            <div class="flex items-center justify-between mb-3">
                <span class="bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 px-3 py-1 rounded-full text-[11px] font-bold">● Verified QR Store</span>
                <a href="admin.html" class="text-xs text-indigo-400 font-semibold hover:underline">Malik Portal →</a>
            </div>
            <h1 class="text-xl font-extrabold">Sharma Kirana & Cafe</h1>
            <p class="text-xs text-slate-300 mt-1"><i class="fa-solid fa-location-dot text-rose-400"></i> Shop 12, MG Road, Bengaluru</p>
        </header>

        <div class="p-4 space-y-3 flex-1 overflow-y-auto">
            <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between border border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl">☕</div>
                    <div><h4 class="font-bold text-sm text-white">Special Masala Chai</h4><p class="text-[11px] text-slate-400">1 Kulhad • <span class="text-emerald-400 font-semibold">₹25</span></p></div>
                </div>
                <button class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-md">+ Add</button>
            </div>
            <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between border border-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl">🥪</div>
                    <div><h4 class="font-bold text-sm text-white">Paneer Grilled Sandwich</h4><p class="text-[11px] text-slate-400">2 Pcs • <span class="text-emerald-400 font-semibold">₹85</span></p></div>
                </div>
                <button class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-md">+ Add</button>
            </div>
        </div>

        <div class="p-4 bg-slate-950/80 border-t border-white/10">
            <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 rounded-2xl font-extrabold text-sm shadow-xl flex items-center justify-center gap-2">
                <span>View Cart & Checkout</span>
                <i class="fa-solid fa-bag-shopping"></i>
            </button>
        </div>
    </div>
</body>
</html>
