<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DukaanLedger | Staff Serving Window</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top left, #0f172a, #090d16 60%, #030712); color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.07); }
    </style>
</head>
<body class="antialiased p-4 sm:p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="glass-panel rounded-3xl p-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-bold text-lg"><i class="fa-solid fa-bell-concierge"></i></div>
                <div>
                    <h2 class="font-bold text-white text-sm">Customer Serving Window</h2>
                    <span class="text-xs text-slate-400">Logged in as: <strong>Ramesh (staff01)</strong></span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="admin.html" class="px-3.5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">Malik Portal</a>
                <a href="customer.html" class="px-3.5 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl">Customer Store</a>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass-card rounded-3xl p-5 space-y-3">
                <h3 class="font-bold text-amber-300 text-sm">1. Incoming Orders</h3>
                <div class="glass-panel p-4 rounded-2xl text-xs space-y-2 border border-amber-500/30">
                    <strong>ORD-102 (Table 02)</strong>
                    <p class="text-slate-300">Ananya Sharma • 2x Masala Chai</p>
                    <button class="w-full py-1.5 bg-indigo-600 text-white font-bold rounded-xl">Accept & Prepare →</button>
                </div>
            </div>
            <div class="glass-card rounded-3xl p-5 space-y-3">
                <h3 class="font-bold text-indigo-300 text-sm">2. Preparing / Packing</h3>
                <div class="border border-dashed border-white/10 rounded-2xl p-6 text-center text-xs text-slate-500">No active prep</div>
            </div>
            <div class="glass-card rounded-3xl p-5 space-y-3">
                <h3 class="font-bold text-emerald-300 text-sm">3. Ready to Serve / Completed</h3>
                <div class="border border-dashed border-white/10 rounded-2xl p-6 text-center text-xs text-slate-500">All handed over</div>
            </div>
        </div>
    </div>
</body>
</html>
